name: Test and deploy Flask

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flask-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_Wtlvhx0je7OcV613fM7nd1KE
      VERCEL_PROJECT_ID: prj_EVfanJYgwg5tLJQsAKiwm93SeQ13
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'Configure repository secret VERCEL_TOKEN before deploying.'
            exit 1
          fi
      - name: Deploy production
        run: |
          npx --yes vercel@65.9.0 deploy --prod --yes \
            --scope gilang23 --project pmb-portal-2402600016 \
            --token "$VERCEL_TOKEN" \
            --env DEPLOYED_BY_GITHUB_ACTIONS=true \
            --env CI_RUN_ID="$GITHUB_RUN_ID" \
            --env CI_GIT_SHA="$GITHUB_SHA"
      - name: Verify public deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/verify_deployment.py
